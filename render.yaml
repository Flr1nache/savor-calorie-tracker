services:
  - type: web
    name: savor-calorie-tracker
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:web
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
